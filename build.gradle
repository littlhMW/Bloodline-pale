// 程序化生成实体贴图：枯血鬼从美术资产提取，血族/血猎/堕落血猎绘制玩家皮肤
tasks.register('generateEntityTextures') {
    def texDir = file('src/main/resources/assets/pale_lullaby/textures/entity')
    outputs.dir texDir
    doLast {
        texDir.mkdirs()

        // ---- 枯血鬼：从美术资产 bbmodel 提取 PNG ----
        def bbFile = new File('D:/Docs/MCMOD/美术资产/枯血鬼MOB.bbmodel')
        if (bbFile.exists()) {
            def bbJson = new groovy.json.JsonSlurper().parseText(bbFile.getText('UTF-8'))
            def src = bbJson.textures[0].source
            def b64 = src.substring(src.indexOf(',') + 1)
            def pngBytes = b64.decodeBase64()
            def ghoulDir = new File(texDir, 'dried_blood_ghost')
            ghoulDir.mkdirs()
            new File(ghoulDir, 'dried_blood_ghost.png').withOutputStream { it.write(pngBytes) }
        }

        // ---- 玩家模型皮肤绘制 ----
        def newSkin = { -> new java.awt.image.BufferedImage(64, 64, java.awt.image.BufferedImage.TYPE_INT_ARGB) }
        def fill = { java.awt.image.BufferedImage bi, int x, int y, int w, int h, def c ->
            for (int yy = y; yy < y + h; yy++)
                for (int xx = x; xx < x + w; xx++)
                    bi.setRGB(xx, yy, (int) (0xFF000000 | (c[0] << 16) | (c[1] << 8) | c[2]))
        }
        def px = { java.awt.image.BufferedImage bi, int x, int y, def c ->
            if (x >= 0 && y >= 0 && x < 64 && y < 64)
                bi.setRGB(x, y, (int) (0xFF000000 | (c[0] << 16) | (c[1] << 8) | c[2]))
        }
        def face = { java.awt.image.BufferedImage bi, def eyeC ->
            px(bi, 9, 11, eyeC); px(bi, 10, 11, eyeC)
            px(bi, 13, 11, eyeC); px(bi, 14, 11, eyeC)
            px(bi, 11, 13, eyeC); px(bi, 12, 13, eyeC)
        }
        def drawSkin = { String name, def skinC, def shirtC, def pantsC, def sleeveC, def hatC, def eyeC ->
            def bi = newSkin()
            // 头
            fill(bi, 8, 0, 8, 8, skinC)
            fill(bi, 16, 0, 8, 8, skinC)
            fill(bi, 0, 8, 8, 8, skinC)
            fill(bi, 8, 8, 8, 8, skinC)
            fill(bi, 16, 8, 8, 8, skinC)
            fill(bi, 24, 8, 8, 8, skinC)
            // 身体
            fill(bi, 20, 16, 8, 12, shirtC)
            fill(bi, 16, 16, 4, 12, shirtC)
            fill(bi, 28, 16, 4, 12, shirtC)
            fill(bi, 32, 16, 8, 12, shirtC)
            fill(bi, 20, 12, 8, 4, shirtC)
            fill(bi, 28, 12, 8, 4, shirtC)
            // 右臂（袖+手）
            fill(bi, 40, 16, 4, 4, sleeveC)
            fill(bi, 44, 16, 4, 4, sleeveC)
            fill(bi, 44, 20, 4, 12, sleeveC)
            fill(bi, 48, 20, 4, 12, sleeveC)
            fill(bi, 52, 20, 4, 12, sleeveC)
            fill(bi, 56, 20, 4, 12, sleeveC)
            fill(bi, 44, 28, 4, 4, skinC)
            fill(bi, 48, 28, 4, 4, skinC)
            fill(bi, 52, 28, 4, 4, skinC)
            fill(bi, 56, 28, 4, 4, skinC)
            // 右腿
            fill(bi, 4, 16, 4, 4, pantsC)
            fill(bi, 8, 16, 4, 4, pantsC)
            fill(bi, 8, 20, 4, 12, pantsC)
            fill(bi, 12, 20, 4, 12, pantsC)
            fill(bi, 0, 20, 4, 12, pantsC)
            fill(bi, 4, 20, 4, 12, pantsC)
            fill(bi, 8, 28, 4, 4, pantsC)
            fill(bi, 12, 28, 4, 4, pantsC)
            fill(bi, 0, 28, 4, 4, pantsC)
            fill(bi, 4, 28, 4, 4, pantsC)
            // 左臂
            fill(bi, 40, 48, 4, 4, sleeveC)
            fill(bi, 44, 48, 4, 4, sleeveC)
            fill(bi, 44, 52, 4, 12, sleeveC)
            fill(bi, 48, 52, 4, 12, sleeveC)
            fill(bi, 52, 52, 4, 12, sleeveC)
            fill(bi, 56, 52, 4, 12, sleeveC)
            fill(bi, 44, 60, 4, 4, skinC)
            fill(bi, 48, 60, 4, 4, skinC)
            fill(bi, 52, 60, 4, 4, skinC)
            fill(bi, 56, 60, 4, 4, skinC)
            // 左腿
            fill(bi, 20, 32, 4, 4, pantsC)
            fill(bi, 24, 32, 4, 4, pantsC)
            fill(bi, 24, 36, 4, 12, pantsC)
            fill(bi, 28, 36, 4, 12, pantsC)
            fill(bi, 16, 36, 4, 12, pantsC)
            fill(bi, 32, 36, 8, 12, pantsC)
            fill(bi, 24, 44, 4, 4, pantsC)
            fill(bi, 28, 44, 4, 4, pantsC)
            fill(bi, 16, 44, 4, 4, pantsC)
            fill(bi, 32, 44, 8, 4, pantsC)
            // 脸
            face(bi, eyeC)
            // 帽层（第二层）
            fill(bi, 40, 0, 8, 8, hatC)
            fill(bi, 32, 8, 8, 8, hatC)
            fill(bi, 40, 8, 8, 8, hatC)
            fill(bi, 48, 8, 8, 8, hatC)
            fill(bi, 56, 8, 8, 8, hatC)
            def out = new File(texDir, name)
            out.getParentFile().mkdirs()
            javax.imageio.ImageIO.write(bi, 'png', out)
        }
        drawSkin('vampire/vampire.png', [226, 219, 213], [40, 9, 19], [25, 25, 31], [40, 9, 19], [12, 6, 9], [0, 0, 0, 255])
        drawSkin('blood_hunter/blood_hunter.png', [223, 189, 157], [93, 63, 37], [65, 45, 29], [111, 79, 49], [71, 47, 27], [0, 0, 0, 255])
        drawSkin('fallen_blood_hunter/fallen_blood_hunter.png', [179, 169, 159], [47, 47, 53], [37, 37, 43], [47, 47, 53], [27, 25, 27], [20, 8, 8, 255])
    }
