plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// 从 gradle.properties 读取所有变量
version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
    exclude("**/PLACE_OGG_FILES_HERE.txt")
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup("software.bernie.geckolib") }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
// MODMIND DEPENDENCIES START
    implementation files('libs/modmind/lithostitched-1.7.13-neoforge-21.1.jar')
    implementation files('libs/modmind/geckolib-neoforge-1.21.1-4.9.2.jar')
// MODMIND DEPENDENCIES END
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('copyReferenceAssets', Copy) {
    from 'src/main/java/com/littlh/palelullaby/参考用'
    include '苍白仆从.geo.json'
    include '苍白仆从动画.json'
    include 'pale_minion.png'
    include 'bloodthirst_mod-1.2.0/assets/bloodthirst_mod_1783939410/textures/block/blood_fluid_overlay.png'
    include 'bloodthirst_mod-1.2.0/assets/bloodthirst_mod_1783939410/textures/block/blood_fluid_still.png'
    include 'bloodthirst_mod-1.2.0/assets/bloodthirst_mod_1783939410/textures/block/blood_fluid_flow.png'
    into file('src/main/resources/assets/pale_lullaby')
    rename { fileName ->
        switch (fileName) {
            case '苍白仆从.geo.json':
                return 'geo/pale_minion.geo.json'
            case '苍白仆从动画.json':
                return 'animations/pale_minion.animation.json'
            case 'pale_minion.png':
                return 'textures/entity/pale_minion/pale_minion.png'
            case 'blood_fluid_overlay.png':
                return 'textures/block/blood_fluid_overlay.png'
            case 'blood_fluid_still.png':
                return 'textures/block/blood_fluid_still.png'
            case 'blood_fluid_flow.png':
                return 'textures/block/blood_fluid_flow.png'
            default:
                return fileName
        }
    }
}

processResources.dependsOn copyReferenceAssets
