// 程序化生成断剑方块纹理与物品图标（按 GeckoLib box-UV 布局绘制 128x128）：
tasks.register('generateBrokenSwordTextures') {
    def itemDir = file('src/main/resources/assets/pale_lullaby/textures/item')
    def blockDir = file('src/main/resources/assets/pale_lullaby/textures/block')
    outputs.dir itemDir
    outputs.dir blockDir
    doLast {
        itemDir.mkdirs()
        blockDir.mkdirs()
        def newImg = { int w, int h -> new java.awt.image.BufferedImage(w, h, java.awt.image.BufferedImage.TYPE_INT_ARGB) }
        def setPx = { java.awt.image.BufferedImage bi, int x, int y, def c ->
            if (x < 0 || y < 0 || x >= bi.getWidth() || y >= bi.getHeight()) return
            bi.setRGB(x, y, (int) (0xFF000000 | (c[0] << 16) | (c[1] << 8) | c[2]))
        }
        def fillRect = { java.awt.image.BufferedImage bi, int x, int y, int w, int h, def c ->
            for (int yy = y; yy < y + h; yy++)
                for (int xx = x; xx < x + w; xx++)
                    setPx(bi, xx, yy, c)
        }
        def write = { File dir, String name, java.awt.image.BufferedImage bi ->
            javax.imageio.ImageIO.write(bi, 'png', new File(dir, name + '.png'))
        }
        def shade = { def c, int d -> [Math.max(0, c[0] - d), Math.max(0, c[1] - d), Math.max(0, c[2] - d), 255] }
        def brighten = { def c, int d -> [Math.min(255, c[0] + d), Math.min(255, c[1] + d), Math.min(255, c[2] + d), 255] }

        // GeckoLib 的 box UV 布局（与 Minecraft 方块模型不同，东西面互换）：
        // UP:(u+z,v) size(x,z)  DOWN:(u+z+x,v+z) size(x,z)
        // NORTH:(u+z,v+z) size(x,y)  SOUTH:(u+z+x+z,v+z) size(x,y)
        // WEST:(u+z+x,v+z) size(z,y)  EAST:(u,v+z) size(z,y)
        def paintCube = { java.awt.image.BufferedImage bi, int u, int v, int sx, int sy, int sz, def baseC, int seed ->
            def rnd = new Random(seed)
            def side = { int x, int y, int w, int h ->
                for (int yy = y; yy < y + h; yy++)
                    for (int xx = x; xx < x + w; xx++) {
                        def c = baseC
                        double r = rnd.nextDouble()
                        if (r < 0.08) c = shade(baseC, 30)
                        else if (r < 0.16) c = brighten(baseC, 18)
                        setPx(bi, xx, yy, c)
                    }
            }
            side(u + sz, v, sx, sz)            // UP
            side(u + sz + sx, v + sz, sx, sz)  // DOWN
            side(u + sz, v + sz, sx, sy)       // NORTH
            side(u + sz + sx + sz, v + sz, sx, sy) // SOUTH
            side(u + sz + sx, v + sz, sz, sy)  // WEST
            side(u, v + sz, sz, sy)            // EAST
        }

        def tex = newImg(128, 128)
        // 石座基座（灰石）
        paintCube(tex, 20, 0, 16, 3, 16, [138, 138, 144, 255], 11)
        // 基座上沿（浅灰石）
        paintCube(tex, 0, 36, 12, 3, 12, [156, 156, 162, 255], 12)
        // 四角小花（茎绿 + 花头红）
        paintCube(tex, 96, 53, 3, 1, 3, [96, 142, 64, 255], 13)
        paintCube(tex, 110, 53, 3, 1, 3, [96, 142, 64, 255], 14)
        paintCube(tex, 56, 53, 2, 3, 2, [86, 132, 58, 255], 15)
        paintCube(tex, 0, 53, 3, 2, 3, [198, 54, 64, 255], 16)
        paintCube(tex, 66, 53, 2, 3, 2, [86, 132, 58, 255], 17)
        paintCube(tex, 14, 53, 3, 2, 3, [198, 54, 64, 255], 18)
        paintCube(tex, 76, 53, 2, 3, 2, [86, 132, 58, 255], 19)
        paintCube(tex, 28, 53, 3, 2, 3, [198, 54, 64, 255], 20)
        paintCube(tex, 86, 53, 2, 3, 2, [86, 132, 58, 255], 21)
        paintCube(tex, 42, 53, 3, 2, 3, [198, 54, 64, 255], 22)
        // 小绿叶
        paintCube(tex, 0, 60, 2, 2, 2, [76, 122, 54, 255], 23)
        paintCube(tex, 10, 60, 2, 2, 2, [76, 122, 54, 255], 24)
        // 剑柄握把（深褐皮革）
        paintCube(tex, 96, 36, 3, 3, 3, [88, 66, 48, 255], 25)
        // 金色护手
        paintCube(tex, 62, 36, 12, 2, 4, [214, 180, 88, 255], 26)
        // 剑身（银灰钢）
        paintCube(tex, 0, 0, 3, 31, 3, [152, 158, 166, 255], 27)
        // 剑身中央亮脊
        paintCube(tex, 14, 0, 1, 31, 1, [222, 230, 240, 255], 28)
        // 断裂尖头（深灰锈铁）
        paintCube(tex, 50, 36, 2, 5, 3, [106, 110, 118, 255], 29)
        paintCube(tex, 110, 36, 1, 3, 3, [106, 110, 118, 255], 30)
        write(blockDir, 'broken_sword', tex)

        // 断剑物品图标（16x16）：斜插断剑
        def icon = newImg(16, 16)
        for (int y = 2; y < 12; y++) {
            int lo = 5 + (y < 6 ? (y - 2) : 0)
            for (int x = lo; x <= 8; x++) {
                def c = [170, 178, 188, 255]
                if (x == lo && y > 2) c = [226, 234, 244, 255]
                setPx(icon, x, y, c)
            }
        }
        // 断裂尖
        setPx(icon, 8, 2, [142, 148, 156, 255])
        setPx(icon, 9, 2, [142, 148, 156, 255])
        setPx(icon, 9, 3, [152, 158, 166, 255])
        // 护手
        fillRect(icon, 3, 11, 5, 1, [216, 182, 94, 255])
        // 握把
        fillRect(icon, 4, 12, 3, 2, [94, 72, 52, 255])
        // 柄头
        fillRect(icon, 4, 14, 3, 1, [72, 56, 42, 255])
        write(itemDir, 'broken_sword', icon)

        // 少女的血月物品图标：血红圆月
        def moon = newImg(16, 16)
        def rnd = new Random(31)
        for (int y = 0; y < 16; y++) {
            for (int x = 0; x < 16; x++) {
                double dx = x - 7.5, dy = y - 7.5
                double dist = Math.sqrt(dx * dx + dy * dy)
                if (dist > 6.6) continue
                def c = [196 + rnd.nextInt(34), 20, 28, 255]
                if (dist > 5.4) c = shade(c, 46)
                if (rnd.nextDouble() < 0.10) c = brighten(c, 24)
                setPx(moon, x, y, c)
            }
        }
        write(itemDir, 'maidens_blood_moon', moon)
    }
}

