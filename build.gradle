// 程序化生成盔甲层纹理（每套 2 层 64x32）
tasks.register('generateArmorTextures') {
    def armorDir = file('src/main/resources/assets/pale_lullaby/textures/models/armor')
    outputs.dir armorDir
    doLast {
        armorDir.mkdirs()
        def newImg = { -> new java.awt.image.BufferedImage(64, 32, java.awt.image.BufferedImage.TYPE_INT_ARGB) }
        def setPx = { java.awt.image.BufferedImage bi, int x, int y, def c ->
            if (x < 0 || y < 0 || x > 63 || y > 31) return
            bi.setRGB(x, y, (int) (0xFF000000 | (c[0] << 16) | (c[1] << 8) | c[2]))
        }
        def darken = { def c, int d -> [Math.max(0, c[0] - d), Math.max(0, c[1] - d), Math.max(0, c[2] - d), 255] }
        def lighten = { def c, int d -> [Math.min(255, c[0] + d), Math.min(255, c[1] + d), Math.min(255, c[2] + d), 255] }
        def drawArmor = { String name, def base ->
            def rnd = new Random(name.hashCode())
            def l1 = newImg()
            def l2 = newImg()
            for (int y = 0; y < 32; y++) {
                for (int x = 0; x < 64; x++) {
                    def c = base
                    double r = rnd.nextDouble()
                    if (r < 0.12) c = darken(base, 22)
                    else if (r < 0.2) c = lighten(base, 20)
                    // 边缘
                    if (x == 0 || y == 0 || x == 63 || y == 31) c = darken(base, 45)
                    // 上半部高光（胸甲区域）
                    if (y < 8 && x > 16 && x < 48 && r > 0.2) c = lighten(base, 12)
                    setPx(l1, x, y, c)
                    // 第二层更暗一点
                    def c2 = darken(base, 18)
                    if (r < 0.12) c2 = darken(base, 38)
                    else if (r < 0.2) c2 = base
                    if (x == 0 || y == 0 || x == 63 || y == 31) c2 = darken(base, 55)
                    setPx(l2, x, y, c2)
                }
            }
            javax.imageio.ImageIO.write(l1, 'png', new File(armorDir, name + '_layer_1.png'))
            javax.imageio.ImageIO.write(l2, 'png', new File(armorDir, name + '_layer_2.png'))
        }
        drawArmor('hunter_leather', [122, 86, 50])
        drawArmor('hunter_cloth', [118, 118, 124])
        drawArmor('hunter_novice', [142, 148, 155])
        drawArmor('hunter_adept', [165, 175, 188])
        drawArmor('hunter_exalted', [212, 180, 92])
        drawArmor('hunter_exiled', [150, 158, 170])
        drawArmor('hunter_fallen', [96, 98, 104])
        drawArmor('inquisitor', [88, 32, 40])
        drawArmor('herbalist', [84, 110, 74])
        drawArmor('silver', [196, 205, 216])
    }
}

