// NOTE: 程序化占位资源任务（generate*/copyReferenceAssets/deleteLegacyFiles）会在构建时覆盖或删除
// src/main/resources 里的贴图/模型文件，导致手动替换的正式美术被还原成旧版。
// 默认已禁用这些挂钩：src/main/resources 里的文件就是最终资源，手动覆盖后不会被还原。
// 需要恢复旧行为时，把下方对应的 processResources.dependsOn 取消注释即可。
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// 从 gradle.properties 读取所有变量
version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
    exclude("**/PLACE_OGG_FILES_HERE.txt")
    exclude("data/pale_lullaby/lithostitched/worldgen_modifier/ore_silver_overworld.json")
    exclude("assets/pale_lullaby/textures/block/soaked_mud_grass_side_overlay.png")
    exclude("assets/pale_lullaby/textures/block/crimson_thorn_spike.png")
    exclude("assets/pale_lullaby/textures/block/pale_grass_block_side_overlay.png")
    exclude("assets/pale_lullaby/textures/block/pale_bone_block.png")
    exclude("data/pale_lullaby/lithostitched/biome_injector/overworld_biomes.json")
    exclude("data/pale_lullaby/worldgen/biome/pale_flower_fields.json")
    exclude("data/pale_lullaby/worldgen/structure/ice_wall.json")
    exclude("data/pale_lullaby/worldgen/structure_set/ice_wall.json")
    exclude("data/pale_lullaby/loot_table/blocks/pale_bone_block.json")
    exclude("data/pale_lullaby/loot_table/blocks/blind_cloud_flower.json")
    exclude("assets/pale_lullaby/blockstates/pale_bone_block.json")
    exclude("assets/pale_lullaby/models/block/pale_bone_block.json")
    exclude("assets/pale_lullaby/models/item/pale_bone_block.json")
    exclude("assets/pale_lullaby/textures/block/blind_cloud_flower.png")
    exclude("assets/pale_lullaby/textures/block/white_matter.png")
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup("software.bernie.geckolib") }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
// MODMIND DEPENDENCIES START
    implementation files('libs/modmind/lithostitched-1.7.13-neoforge-21.1.jar')
    implementation files('libs/modmind/geckolib-neoforge-1.21.1-4.9.2.jar')
    compileOnly files('libs/modmind/irons_spellbooks-1.21.1-3.16.2.jar')
    runtimeOnly files('libs/modmind/irons_lib-1.21.1-2.1.0.jar')
    runtimeOnly files('libs/modmind/curios-neoforge-9.5.1+1.21.1.jar')
    runtimeOnly files('libs/modmind/player-animation-lib-forge-2.0.4+1.21.1.jar')
// MODMIND DEPENDENCIES END
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('copyReferenceAssets', Copy) {
    from 'src/main/java/com/littlh/palelullaby/参考用'
    include '苍白仆从.geo.json'
    include '苍白仆从动画.json'
    include 'pale_minion.png'
    include 'bloodthirst_mod-1.2.0/assets/bloodthirst_mod_1783939410/textures/block/blood_fluid_overlay.png'
    include 'bloodthirst_mod-1.2.0/assets/bloodthirst_mod_1783939410/textures/block/blood_fluid_still.png'
    include 'bloodthirst_mod-1.2.0/assets/bloodthirst_mod_1783939410/textures/block/blood_fluid_flow.png'
    into file('src/main/resources/assets/pale_lullaby')
    rename { fileName ->
        switch (fileName) {
            case '苍白仆从.geo.json':
                return 'geo/pale_minion.geo.json'
            case '苍白仆从动画.json':
                return 'animations/pale_minion.animation.json'
            case 'pale_minion.png':
                return 'textures/entity/pale_minion/pale_minion.png'
            case 'blood_fluid_overlay.png':
                return 'textures/block/blood_fluid_overlay.png'
            case 'blood_fluid_still.png':
                return 'textures/block/blood_fluid_still.png'
            case 'blood_fluid_flow.png':
                return 'textures/block/blood_fluid_flow.png'
            default:
                return fileName
        }
    }
}

// 程序化生成 16x16 方块纹理（避免在仓库里提交二进制 PNG）
tasks.register('generateBlockTextures') {
    def texDir = file('src/main/resources/assets/pale_lullaby/textures/block')
    outputs.dir texDir
    outputs.upToDateWhen { false }
    doLast {
        texDir.mkdirs()
        def newImg = { -> new java.awt.image.BufferedImage(16, 16, java.awt.image.BufferedImage.TYPE_INT_ARGB) }
        def setPx = { java.awt.image.BufferedImage bi, int x, int y, def c ->
            if (x < 0 || y < 0 || x > 15 || y > 15) return
            int a = c.size() >= 4 ? (int) c[3] : 255
            if (a == 0) {
                bi.setRGB(x, y, 0)
            } else {
                bi.setRGB(x, y, (int) ((int) (0xFF000000 | (((int) c[0]) << 16) | (((int) c[1]) << 8) | ((int) c[2]))))
            }
        }
        def getPx = { java.awt.image.BufferedImage bi, int x, int y ->
            int rgb = bi.getRGB(x, y)
            return [ (rgb >> 16) & 0xFF, (rgb >> 8) & 0xFF, rgb & 0xFF, (rgb >>> 24) & 0xFF ] as int[]
        }
        def writeTex = { String name, java.awt.image.BufferedImage bi ->
            javax.imageio.ImageIO.write(bi, 'png', new File(texDir, name + '.png'))
        }

        // red_needle_log：深红棕竖向树皮
        def log = newImg()
        def rnd = new Random(11)
        def colVariant = new double[16]
        for (int x = 0; x < 16; x++) colVariant[x] = rnd.nextDouble()
        for (int y = 0; y < 16; y++) {
            for (int x = 0; x < 16; x++) {
                double v = colVariant[x]
                int[] c
                if (v < 0.18) c = [51, 23, 8, 255]
                else if (v < 0.62) c = [90, 45, 26, 255]
                else if (v < 0.88) c = [107, 52, 30, 255]
                else c = [131, 63, 32, 255]
                if (y % 5 == 3) c = [51, 23, 8, 255]
                else if (y % 5 == 4) c = [Math.min(255, c[0] + 14), Math.min(255, c[1] + 8), Math.min(255, c[2] + 5), 255]
                if (x == 3 && y == 7) c = [40, 18, 8, 255]
                if (x == 4 && y == 7) c = [30, 14, 6, 255]
                if (x == 3 && y == 8) c = [58, 28, 15, 255]
                if (x == 11 && y == 2) c = [36, 17, 8, 255]
                setPx(log, x, y, c)
            }
        }
        for (int y = 0; y < 16; y++) {
            for (int x = 0; x < 16; x += 4) {
                int[] c = getPx(log, x, y)
                setPx(log, x, y, [Math.max(0, c[0] - 18), Math.max(0, c[1] - 10), Math.max(0, c[2] - 4), 255])
            }
        }
        writeTex('red_needle_log', log)

        // red_needle_log_top：同心年轮
        def top = newImg()
        rnd = new Random(22)
        for (int y = 0; y < 16; y++) {
            for (int x = 0; x < 16; x++) {
                double dx = x - 7.5 + (rnd.nextDouble() - 0.5) * 0.6
                double dy = y - 7.5 + (rnd.nextDouble() - 0.5) * 0.6
                double d = Math.sqrt(dx * dx + dy * dy)
                int[] c
                if (d < 1.6) c = [52, 26, 13, 255]
                else if (d < 2.8) c = [74, 37, 20, 255]
                else if (d < 4.2) c = [94, 47, 27, 255]
                else if (d < 5.4) c = [62, 31, 16, 255]
                else if (d < 6.8) c = [94, 47, 27, 255]
                else c = [62, 31, 16, 255]
                double wob = Math.sin(d * 9.0 + 1.3)
                if (Math.abs(d - 2.2) < 0.35 || Math.abs(d - 4.8) < 0.35 || Math.abs(d - 6.2) < 0.3) {
                    c = [c[0] - 12, c[1] - 6, c[2] - 3, 255]
                }
                setPx(top, x, y, c)
            }
        }
        writeTex('red_needle_log_top', top)

        // red_needle_leaves：褐红针叶
        def leaves = newImg()
        rnd = new Random(33)
        def holes = new HashSet<String>()
        for (int i = 0; i < 6; i++) holes.add(((int) Math.floor(rnd.nextDouble() * 16)) + ',' + ((int) Math.floor(rnd.nextDouble() * 16)))
        for (int y = 0; y < 16; y++) {
            for (int x = 0; x < 16; x++) {
                if (holes.contains(x + ',' + y)) {
                    setPx(leaves, x, y, [0, 0, 0, 0])
                    continue
                }
                double r = rnd.nextDouble()
                int[] c
                if (r < 0.28) c = [110, 45, 26, 255]
                else if (r < 0.5) c = [84, 33, 20, 255]
                else if (r < 0.72) c = [138, 59, 34, 255]
                else if (r < 0.88) c = [66, 25, 14, 255]
                else c = [158, 74, 42, 255]
                setPx(leaves, x, y, c)
            }
        }
        for (int y = 0; y < 16; y++) {
            for (int x = 0; x < 16; x++) {
                if (rnd.nextDouble() < 0.35) {
                    int[] cur = getPx(leaves, x, y)
                    int[] nb = getPx(leaves, Math.min(15, x + 1), y)
                    if (nb[3] > 0) {
                        setPx(leaves, x, y, [ (cur[0] + nb[0]) / 2, (cur[1] + nb[1]) / 2, (cur[2] + nb[2]) / 2, 255 ])
                    }
                }
            }
        }
        writeTex('red_needle_leaves', leaves)

        // blind_cloud_flower：白色云雾状花 + 绿茎
        def flower = newImg()
        rnd = new Random(44)
        for (int y = 10; y < 16; y++) {
            setPx(flower, 8, y, y >= 13 ? [52, 96, 48, 255] : [72, 124, 64, 255])
        }
        setPx(flower, 7, 10, [96, 150, 80, 255])
        setPx(flower, 7, 11, [96, 150, 80, 255])
        setPx(flower, 9, 13, [96, 150, 80, 255])
        def puffs = [
            [5.5, 4.0, 2.2], [10.5, 3.6, 2.4], [8.0, 2.4, 2.0], [4.0, 7.0, 1.7],
            [12.0, 6.6, 1.7], [8.0, 7.2, 2.6], [6.0, 9.0, 1.6], [10.2, 9.0, 1.6]
        ]
        for (def p : puffs) {
            for (int y = 0; y < 16; y++) {
                for (int x = 0; x < 16; x++) {
                    double d = Math.sqrt((x - p[0]) * (x - p[0]) + (y - p[1]) * (y - p[1]))
                    double rr = p[2] + (rnd.nextDouble() - 0.5) * 0.5
                    if (d <= rr) {
                        double edge = rr - d
                        int[] c = [255, 255, 255, 255]
                        if (edge < 0.55) c = [204, 214, 206, 255]
                        else if (edge < 1.1) c = [226, 232, 226, 255]
                        if (x - p[0] < 0 && y - p[1] > 0 && edge > 0.4) c = [226, 232, 226, 255]
                        int[] cur = getPx(flower, x, y)
                        if (cur[3] == 0 || rnd.nextDouble() < 0.5) setPx(flower, x, y, c)
                    }
                }
            }
        }
        setPx(flower, 8, 4, [255, 246, 200, 255])
        setPx(flower, 7, 4, [255, 246, 200, 255])
        writeTex('blind_floss_flower', flower)

        // soaked_mud：被血浸湿的暗红淤泥
        def mud = newImg()
        def mudRnd = new Random(55)
        for (int y = 0; y < 16; y++) {
            for (int x = 0; x < 16; x++) {
                double r = mudRnd.nextDouble()
                int[] c
                if (r < 0.2) c = [58, 20, 18, 255]
                else if (r < 0.55) c = [84, 30, 26, 255]
                else if (r < 0.82) c = [98, 36, 30, 255]
                else c = [116, 44, 36, 255]
                setPx(mud, x, y, c)
            }
        }
        for (int i = 0; i < 12; i++) {
            setPx(mud, mudRnd.nextInt(16), mudRnd.nextInt(16), [46, 10, 22, 255])
        }
        writeTex('soaked_mud', mud)

        // soaked_mud_grass_top：暗红草皮顶部
        def mudTop = newImg()
        def topRnd = new Random(66)
        for (int y = 0; y < 16; y++) {
            for (int x = 0; x < 16; x++) {
                double r = topRnd.nextDouble()
                int[] c
                if (r < 0.22) c = [60, 10, 20, 255]
                else if (r < 0.55) c = [74, 14, 26, 255]
                else if (r < 0.82) c = [88, 20, 32, 255]
                else c = [100, 26, 38, 255]
                setPx(mudTop, x, y, c)
            }
        }
        writeTex('soaked_mud_grass_top', mudTop)

        // soaked_mud_grass_side：下半淤泥 + 顶部暗红草皮
        def mudSide = newImg()
        def sideRnd = new Random(77)
        for (int y = 0; y < 16; y++) {
            for (int x = 0; x < 16; x++) {
                double r = sideRnd.nextDouble()
                int[] c
                if (y < 4) {
                    if (r < 0.25) c = [60, 10, 20, 255]
                    else if (r < 0.6) c = [74, 14, 26, 255]
                    else c = [90, 22, 34, 255]
                } else {
                    if (r < 0.2) c = [58, 20, 18, 255]
                    else if (r < 0.6) c = [84, 30, 26, 255]
                    else c = [100, 38, 32, 255]
                }
                setPx(mudSide, x, y, c)
            }
        }
        writeTex('soaked_mud_grass_side', mudSide)


    }
}

// Delete legacy files: ModMind cannot delete files directly, so we use a task to remove them at build time.
tasks.register('deleteLegacyFiles') {
    outputs.upToDateWhen { false }
    doLast {
        delete(
            'src/main/resources/data/pale_lullaby/worldgen/biome/pale_flower_fields.json',
            'src/main/resources/data/pale_lullaby/loot_table/blocks/pale_bone_block.json',
            'src/main/resources/data/pale_lullaby/loot_table/blocks/blind_cloud_flower.json',
            'src/main/resources/assets/pale_lullaby/blockstates/pale_bone_block.json',
            'src/main/resources/assets/pale_lullaby/models/block/pale_bone_block.json',
            'src/main/resources/assets/pale_lullaby/models/item/pale_bone_block.json',
            'src/main/resources/data/pale_lullaby/lithostitched/biome_injector/overworld_biomes.json',
            'src/main/resources/data/pale_lullaby/worldgen/structure/ice_wall.json',
            'src/main/resources/data/pale_lullaby/worldgen/structure_set/ice_wall.json',
            'src/main/resources/data/pale_lullaby/tags/worldgen/biome/has_structure/ice_wall.json'
        )
    }
}

