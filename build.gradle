// 程序化生成银系 16x16 贴图
tasks.register('generateSilverTextures') {
    def itemDir = file('src/main/resources/assets/pale_lullaby/textures/item')
    def blockDir = file('src/main/resources/assets/pale_lullaby/textures/block')
    outputs.dir itemDir
    outputs.dir blockDir
    doLast {
        itemDir.mkdirs()
        blockDir.mkdirs()
        def newImg = { -> new java.awt.image.BufferedImage(16, 16, java.awt.image.BufferedImage.TYPE_INT_ARGB) }
        def setPx = { java.awt.image.BufferedImage bi, int x, int y, def c ->
            if (x < 0 || y < 0 || x > 15 || y > 15) return
            bi.setRGB(x, y, (int) (0xFF000000 | (c[0] << 16) | (c[1] << 8) | c[2]))
        }
        def write = { File dir, String name, java.awt.image.BufferedImage bi ->
            javax.imageio.ImageIO.write(bi, 'png', new File(dir, name + '.png'))
        }
        def rnd = new Random(77)

        // silver_ingot：银锭
        def ingot = newImg()
        for (int y = 0; y < 16; y++) {
            int lo, hi
            if (y == 2 || y == 13) { lo = 5; hi = 10 }
            else if (y == 3 || y == 12) { lo = 4; hi = 11 }
            else if (y >= 4 && y <= 11) { lo = 3; hi = 12 }
            else continue
            for (int x = lo; x <= hi; x++) {
                def c = [203, 210, 218, 255]
                if (x == lo || x == hi || y == 2 || y == 13) c = [150, 158, 166, 255]
                else if (x == lo + 1 && y == lo + 1) c = [238, 242, 246, 255]
                else if (rnd.nextDouble() < 0.12) c = [215, 222, 229, 255]
                setPx(ingot, x, y, c)
            }
        }
        write(itemDir, 'silver_ingot', ingot)

        // silver_ore：石头底 + 银色矿点
        def ore = newImg()
        rnd = new Random(88)
        for (int y = 0; y < 16; y++) {
            for (int x = 0; x < 16; x++) {
                double r = rnd.nextDouble()
                int v = 96 + (int) (r * 42)
                def c = [v, v + 2, v + 6, 255]
                if (r < 0.1) c = [v - 14, v - 12, v - 8, 255]
                setPx(ore, x, y, c)
            }
        }
        def spots = [[2, 3], [2, 4], [3, 3], [3, 4], [9, 6], [9, 7], [10, 6], [10, 7], [5, 11], [6, 11], [5, 12], [6, 12], [13, 12], [14, 12], [13, 13], [14, 13]]
        for (int i = 0; i < spots.size(); i += 4) {
            for (int k = 0; k < 4; k++) {
                def p = spots[i + k]
                int b = 200 + rnd.nextInt(35)
                setPx(ore, p[0], p[1], [b, b, b + 4, 255])
            }
        }
        write(blockDir, 'silver_ore', ore)

        // silver_block：亮银方块
        def block = newImg()
        rnd = new Random(99)
        for (int y = 0; y < 16; y++) {
            for (int x = 0; x < 16; x++) {
                int[] c
                if (x == 0 || y == 0 || x == 15 || y == 15) c = [168, 176, 184, 255]
                else {
                    int base = 208 + (int) (rnd.nextDouble() * 24)
                    c = [base, base + 4, base + 8, 255]
                    if (x < 6 && y < 6) c = [c[0] + 14, c[1] + 14, c[2] + 14, 255]
                    if (x > 10 && y > 10) c = [c[0] - 18, c[1] - 18, c[2] - 18, 255]
                }
                setPx(block, x, y, c)
            }
        }
        write(blockDir, 'silver_block', block)
    }
}

